[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 100_000_000
bytecode_hash = 'none'
fuzz.runs = 10_000
fs_permissions = [
    { access = "read-write", path = "./script/wormhole.json" },
    { access = "read-write", path = "./script/polymer.json" },
    { access = "read", path = "./test/oracle/broadcaster/payloads/ethereum-sepolia" },
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options


[profile.tron]
src = "src"
out = "out"
libs = ["lib"]
# the-compact pins pragma =0.8.30, which the Tron solc cannot satisfy; the Tron
# deploy (script/tron/deploy-oif.ts) never uses the compact settler, so skip it
# and its dependents (mirrors the --skip flags documented in deploy-oif.ts).
skip = [
    "**/the-compact/**",
    "**/InputSettlerCompact*",
    "**/RegisterIntent*",
    "test/**",
    "script/*.s.sol",
]
via_ir = true
solc_version = "0.8.35"
evm_version = "cancun"
optimizer = true
optimizer_runs = 100_000_000
bytecode_hash = 'none'

[fmt]
sort_imports = true
bracket_spacing = true
single_line_statement_blocks = "single"
multiline_func_header = "params_first"
wrap_comments = true
tab_width = 4
